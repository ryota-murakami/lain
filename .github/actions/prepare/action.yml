description: Prepares the repo for a typical CI job

name: Prepare

runs:
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26.12.1'
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
