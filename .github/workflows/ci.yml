name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  knip:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm knip

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm lint

  typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm typecheck

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: apps/desktop/coverage/lcov.info

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm build

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm test:e2e

  e2e-coverage:
    runs-on: macos-latest
    needs: [e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm --silent coverage:e2e-spec > apps/desktop/docs/e2e-coverage.md
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-spec-coverage
          path: apps/desktop/docs/e2e-coverage.md

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare
      - run: pnpm validate:web
