name: Fallow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: fallow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Fallow ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [dead-code, dupes, architecture]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm quality:${{ matrix.check }}
  health:
    name: Fallow measured health
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm test:coverage
      - run: pnpm quality:health
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fallow-measured-coverage
          path: apps/desktop/coverage/
          retention-days: 7
  audit:
    name: Fallow changed code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare
      # Complexity here is static; measured CRAP is gated by the health job.
      - shell: bash
        run: pnpm quality:audit --base "$FALLOW_AUDIT_BASE" --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
