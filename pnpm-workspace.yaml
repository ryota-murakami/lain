packages:
  - 'apps/*'

# Supply-chain security (migrated from .npmrc 2026-05-07)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - react
  - react-dom
  - '@types/react'
  - '@types/react-dom'
  - typescript
  - vite
  - vitest
  - '@vitejs/plugin-react'
  - eslint
  - prettier
  - tailwindcss
  - '@tanstack/react-query'
  - zod
  - react-hook-form
  - eslint-config-ts-prefixer
  - '@laststance/redux-storage-middleware'
  - '@laststance/react-next-eslint-plugin'
verifyStoreIntegrity: true

overrides:
  # Keep the inherited mature security floor; 1.16.3 is still inside the 24-hour hold.
  'follow-redirects@<1.16.2': '1.16.2'
  # Mature same-major fixes for the canonical Tailwind formatter's pinned parsers.
  'postcss@>=8.0.0 <8.5.23': '8.5.32'
  'postcss-selector-parser@>=6.0.0 <6.1.5': '6.1.5'

# pnpm 12 replacement for the previous explicit onlyBuiltDependencies list.
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  unrs-resolver: true
